
name: Build PB AZKIYA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: unzip -o PB_AZKIYA_Android_Project.zip

      - name: Extract Logo Assets
        run: |
          mkdir -p /tmp/pb-azkiya-logo
          unzip -o PB_AZKIYA_Logo_Icon_Assets.zip -d /tmp/pb-azkiya-logo
          RES="PB_AZKIYA_Android/app/src/main/res"
          mkdir -p "$RES"
          cp -R /tmp/pb-azkiya-logo/mipmap-* "$RES/"
          mkdir -p "$RES/drawable"
          cp -R /tmp/pb-azkiya-logo/drawable/. "$RES/drawable/"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PB AZKIYA APK
        working-directory: PB_AZKIYA_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PB-AZKIYA-APK
          path: PB_AZKIYA_Android/app/build/outputs/apk/debug/app-debug.apk
